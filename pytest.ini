[pytest]
# Only collect our test suite. ops/vllm/smoke_test.py is a manual script for the
# LLM endpoint (it needs LLM_API_KEY) and must not run as part of pytest.
testpaths = tests
# SAFE-6: tests that need the served model (Tailscale + .env) are marked @pytest.mark.llm;
# CI and tools/check.sh run `pytest -m "not llm"`.
markers =
    llm: needs the served LLM endpoint; skipped in CI
